<svg width="1000" height="240" viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="1000" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="55%" stop-color="#14213D"/>
      <stop offset="100%" stop-color="#1C314E"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.82" cy="0.28" r="0.32">
      <stop offset="0%" stop-color="#CAF0F8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#90E0EF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5BC0BE" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#90E0EF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#CAF0F8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mountainBack" x1="0" y1="110" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#274060"/>
      <stop offset="100%" stop-color="#162640"/>
    </linearGradient>
    <linearGradient id="mountainFront" x1="0" y1="140" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#335175"/>
      <stop offset="100%" stop-color="#1B2E4B"/>
    </linearGradient>
    <linearGradient id="snowDrift" x1="0" y1="190" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#B8E1EE"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="1000" height="240" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Sky -->
    <rect width="1000" height="240" fill="url(#skyGrad)"/>
    <rect width="1000" height="240" fill="url(#moonGlow)"/>

    <!-- Subtle Aurora Ribbon -->
    <path d="M0 70 C 200 20, 420 110, 680 45 C 820 12, 920 55, 1000 35 L 1000 130 C 850 110, 650 155, 420 115 C 220 80, 100 130, 0 115 Z" fill="url(#aurora)"/>

    <!-- Crescent Moon -->
    <circle cx="820" cy="66" r="24" fill="#F0F9FF" fill-opacity="0.92"/>
    <circle cx="830" cy="60" r="21" fill="#14213D"/>

    <!-- Distant Snowy Mountains -->
    <path d="M0 190 L 120 125 L 240 175 L 390 105 L 540 170 L 700 115 L 860 165 L 1000 120 L 1000 240 L 0 240 Z" fill="url(#mountainBack)"/>
    <!-- Snow Caps on Back Mountains -->
    <path d="M390 105 L 352 128 L 376 125 L 390 135 L 408 124 L 428 128 Z" fill="#E0F7FA" fill-opacity="0.75"/>
    <path d="M700 115 L 668 134 L 688 131 L 703 140 L 718 130 L 736 133 Z" fill="#E0F7FA" fill-opacity="0.7"/>
    <path d="M120 125 L 92 142 L 110 139 L 122 146 L 136 138 L 150 142 Z" fill="#E0F7FA" fill-opacity="0.65"/>

    <!-- Midground Mountains -->
    <path d="M0 205 L 180 150 L 320 195 L 490 140 L 660 198 L 830 148 L 1000 192 L 1000 240 L 0 240 Z" fill="url(#mountainFront)"/>

    <!-- Minimalist Pine Silhouettes -->
    <g fill="#102036">
      <polygon points="90,210 104,168 118,210"/>
      <polygon points="118,212 130,178 142,212"/>
      <polygon points="880,210 894,166 908,210"/>
      <polygon points="908,212 920,176 932,212"/>
      <polygon points="932,215 942,186 952,215"/>
    </g>

    <!-- Soft Snowdrifts -->
    <path d="M0 208 C 180 190, 340 222, 540 202 C 740 184, 880 214, 1000 198 L 1000 240 L 0 240 Z" fill="url(#snowDrift)" fill-opacity="0.92"/>
    <path d="M0 222 C 240 208, 460 232, 720 214 C 860 204, 940 220, 1000 215 L 1000 240 L 0 240 Z" fill="#FFFFFF" fill-opacity="0.88"/>

    <!-- Falling Snowflakes -->
    <g fill="#FFFFFF">
      <circle cx="70" cy="42" r="2.2" fill-opacity="0.85"/>
      <circle cx="145" cy="88" r="1.6" fill-opacity="0.6"/>
      <circle cx="210" cy="36" r="2.5" fill-opacity="0.75"/>
      <circle cx="275" cy="112" r="1.5" fill-opacity="0.55"/>
      <circle cx="330" cy="64" r="2" fill-opacity="0.8"/>
      <circle cx="415" cy="48" r="1.8" fill-opacity="0.65"/>
      <circle cx="480" cy="95" r="2.4" fill-opacity="0.85"/>
      <circle cx="545" cy="34" r="1.6" fill-opacity="0.6"/>
      <circle cx="615" cy="76" r="2.2" fill-opacity="0.75"/>
      <circle cx="685" cy="44" r="1.5" fill-opacity="0.5"/>
      <circle cx="745" cy="92" r="2.6" fill-opacity="0.85"/>
      <circle cx="885" cy="46" r="2" fill-opacity="0.7"/>
      <circle cx="940" cy="96" r="1.7" fill-opacity="0.65"/>
      <circle cx="170" cy="145" r="1.5" fill-opacity="0.5"/>
      <circle cx="590" cy="138" r="1.8" fill-opacity="0.6"/>
      <circle cx="780" cy="130" r="1.5" fill-opacity="0.55"/>
    </g>

    <!-- Delicate Crystal Snowflakes -->
    <g stroke="#E0F7FA" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.7">
      <g transform="translate(260, 56)">
        <line x1="-6" y1="0" x2="6" y2="0"/>
        <line x1="-3" y1="-5.2" x2="3" y2="5.2"/>
        <line x1="-3" y1="5.2" x2="3" y2="-5.2"/>
      </g>
      <g transform="translate(520, 62)">
        <line x1="-5" y1="0" x2="5" y2="0"/>
        <line x1="-2.5" y1="-4.3" x2="2.5" y2="4.3"/>
        <line x1="-2.5" y1="4.3" x2="2.5" y2="-4.3"/>
      </g>
      <g transform="translate(910, 72)">
        <line x1="-5.5" y1="0" x2="5.5" y2="0"/>
        <line x1="-2.75" y1="-4.8" x2="2.75" y2="4.8"/>
        <line x1="-2.75" y1="4.8" x2="2.75" y2="-4.8"/>
      </g>
    </g>
  </g>
</svg>
