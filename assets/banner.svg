<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1000" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A110E"/>
      <stop offset="50%" stop-color="#2D1810"/>
      <stop offset="100%" stop-color="#4A2012"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#FF9F1C"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="160" x2="1000" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFB703" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.28" r="0.35">
      <stop offset="0%" stop-color="#FF7B00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF7B00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="260" rx="18" fill="url(#bgGrad)"/>
  <rect width="1000" height="260" rx="18" fill="url(#glow)"/>

  <!-- Subtle Grid Dots -->
  <g fill="#FFB703" fill-opacity="0.10">
    <circle cx="60" cy="44" r="2"/><circle cx="90" cy="44" r="2"/><circle cx="120" cy="44" r="2"/>
    <circle cx="60" cy="74" r="2"/><circle cx="90" cy="74" r="2"/><circle cx="120" cy="74" r="2"/>
    <circle cx="880" cy="190" r="2"/><circle cx="910" cy="190" r="2"/><circle cx="940" cy="190" r="2"/>
    <circle cx="880" cy="220" r="2"/><circle cx="910" cy="220" r="2"/><circle cx="940" cy="220" r="2"/>
  </g>

  <!-- Warm Decorative Waves -->
  <path d="M0 195 C 220 150, 380 235, 620 190 C 790 158, 900 205, 1000 180 L 1000 260 L 0 260 Z" fill="url(#waveGrad)"/>
  <path d="M0 218 C 260 185, 480 245, 740 205 C 860 186, 940 215, 1000 202 L 1000 260 L 0 260 Z" fill="#FF6B35" fill-opacity="0.10"/>

  <!-- Top Accent Bar -->
  <rect x="64" y="54" width="68" height="5" rx="2.5" fill="url(#accentGrad)"/>

  <!-- Main Title -->
  <text x="64" y="114" fill="#FFF8F0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
    Hey, I'm Patin Bakar
  </text>

  <!-- Subtitle -->
  <text x="64" y="154" fill="#F4D3B8" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">
    Cooking up code, one commit at a time
  </text>

  <!-- Tag Pill -->
  <rect x="64" y="180" width="256" height="34" rx="17" fill="#FF6B35" fill-opacity="0.18" stroke="#FF9F1C" stroke-opacity="0.55" stroke-width="1.2"/>
  <text x="84" y="202" fill="#FFD166" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600">
    &lt;learning-to-code /&gt;
  </text>

  <!-- Playful Flame + Code Emblem on Right -->
  <g transform="translate(800, 62)">
    <circle cx="66" cy="66" r="56" fill="#FF6B35" fill-opacity="0.14" stroke="#FF9F1C" stroke-opacity="0.4" stroke-width="1.5"/>
    <!-- Stylized Flame -->
    <path d="M68 24 C 68 24, 92 46, 92 70 C 92 86, 80 98, 66 98 C 52 98, 40 86, 40 70 C 40 56, 49 44, 55 38 C 54 47, 60 52, 60 52 C 60 40, 68 24, 68 24 Z" fill="url(#accentGrad)"/>
    <path d="M66 56 C 66 56, 77 67, 77 77 C 77 84, 72 90, 66 90 C 60 90, 55 84, 55 77 C 55 70, 61 62, 66 56 Z" fill="#FFF3B0"/>
  </g>
</svg>
