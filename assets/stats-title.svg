<svg width="1000" height="54" viewBox="0 0 1000 54" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pillBg" x1="0" y1="0" x2="1000" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#14213D"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="lineLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3A506B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#90E0EF" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="lineRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#90E0EF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3A506B" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pillClip">
      <rect width="1000" height="54" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#pillClip)">
    <rect x="0.75" y="0.75" width="998.5" height="52.5" rx="12" fill="url(#pillBg)" stroke="#3A506B" stroke-width="1.5"/>

    <!-- Animated Snowfall -->
    <g fill="#FFFFFF">
      <circle cx="80" cy="0" r="1.4" fill-opacity="0.55">
        <animateTransform attributeName="transform" type="translate" values="0,-6; 8,62" dur="4.2s" begin="-0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="195" cy="0" r="1.8" fill-opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0,-6; -6,62" dur="5.1s" begin="-2.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="310" cy="0" r="1.3" fill-opacity="0.5">
        <animateTransform attributeName="transform" type="translate" values="0,-6; 7,62" dur="4.6s" begin="-3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="690" cy="0" r="1.5" fill-opacity="0.6">
        <animateTransform attributeName="transform" type="translate" values="0,-6; -7,62" dur="4.8s" begin="-1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="805" cy="0" r="1.8" fill-opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0,-6; 9,62" dur="5.4s" begin="-3.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="920" cy="0" r="1.4" fill-opacity="0.55">
        <animateTransform attributeName="transform" type="translate" values="0,-6; -6,62" dur="4.4s" begin="-0.3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Decorative Frost Lines -->
    <rect x="40" y="26" width="340" height="1.5" rx="0.75" fill="url(#lineLeft)"/>
    <rect x="620" y="26" width="340" height="1.5" rx="0.75" fill="url(#lineRight)"/>

    <!-- Rotating Snowflake Icon -->
    <g transform="translate(426, 27)">
      <g stroke="#90E0EF" stroke-width="1.5" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
        <line x1="-7" y1="0" x2="7" y2="0"/>
        <line x1="-3.5" y1="-6.06" x2="3.5" y2="6.06"/>
        <line x1="-3.5" y1="6.06" x2="3.5" y2="-6.06"/>
      </g>
    </g>

    <!-- Title -->
    <text x="514" y="33" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.2">
      STATISTICS
    </text>
  </g>
</svg>
