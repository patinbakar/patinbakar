<svg width="1000" height="130" viewBox="0 0 1000 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerSky" x1="0" y1="0" x2="1000" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#14213D"/>
      <stop offset="100%" stop-color="#1C314E"/>
    </linearGradient>
    <linearGradient id="mountainBack" x1="0" y1="30" x2="0" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#274060"/>
      <stop offset="100%" stop-color="#162640"/>
    </linearGradient>
    <linearGradient id="mountainFront" x1="0" y1="50" x2="0" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#335175"/>
      <stop offset="100%" stop-color="#1B2E4B"/>
    </linearGradient>
    <linearGradient id="waveFront" x1="0" y1="80" x2="1000" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CAF0F8" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#E0F7FA" stop-opacity="0.96"/>
    </linearGradient>
    <clipPath id="footerRounded">
      <rect width="1000" height="130" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footerRounded)">
    <!-- Background -->
    <rect width="1000" height="130" fill="url(#footerSky)"/>

    <!-- Distant Snowy Mountains -->
    <path d="M0 95 L 110 42 L 220 85 L 350 32 L 490 82 L 640 38 L 790 84 L 910 40 L 1000 78 L 1000 130 L 0 130 Z" fill="url(#mountainBack)"/>
    <!-- Snow Caps on Back Mountains -->
    <path d="M350 32 L 318 52 L 339 49 L 351 57 L 365 48 L 382 52 Z" fill="#E0F7FA" fill-opacity="0.72"/>
    <path d="M640 38 L 612 55 L 630 52 L 642 60 L 655 51 L 670 55 Z" fill="#E0F7FA" fill-opacity="0.68"/>
    <path d="M110 42 L 86 58 L 102 55 L 112 62 L 124 54 L 136 58 Z" fill="#E0F7FA" fill-opacity="0.65"/>
    <path d="M910 40 L 886 56 L 901 53 L 912 60 L 924 52 L 936 56 Z" fill="#E0F7FA" fill-opacity="0.65"/>

    <!-- Midground Mountains -->
    <path d="M0 105 L 160 62 L 290 98 L 460 54 L 610 100 L 760 58 L 900 96 L 1000 68 L 1000 130 L 0 130 Z" fill="url(#mountainFront)"/>

    <!-- Minimalist Pine Trees -->
    <g fill="#102036">
      <polygon points="56,106 68,72 80,106"/>
      <polygon points="82,108 92,80 102,108"/>
      <polygon points="104,110 112,88 120,110"/>
      <polygon points="480,108 490,78 500,108"/>
      <polygon points="502,110 510,86 518,110"/>
      <polygon points="852,108 864,74 876,108"/>
      <polygon points="878,106 890,70 902,106"/>
      <polygon points="904,108 914,80 924,108"/>
      <polygon points="926,110 934,86 942,110"/>
    </g>

    <!-- Layered Snow Waves -->
    <path d="M0 94 C 240 76, 480 112, 740 86 C 860 74, 940 94, 1000 88 L 1000 130 L 0 130 Z" fill="url(#waveFront)"/>
    <path d="M0 108 C 220 96, 460 120, 720 102 C 860 94, 940 108, 1000 102 L 1000 130 L 0 130 Z" fill="#FFFFFF" fill-opacity="0.93"/>

    <!-- Animated Falling Snowfall -->
    <g fill="#FFFFFF">
      <circle cx="95" cy="0" r="1.8" fill-opacity="0.8">
        <animateTransform attributeName="transform" type="translate" values="0,-10; 10,140" dur="5.5s" begin="-1.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="185" cy="0" r="1.4" fill-opacity="0.55">
        <animateTransform attributeName="transform" type="translate" values="0,-10; -8,140" dur="7.2s" begin="-3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="290" cy="0" r="2.2" fill-opacity="0.75">
        <animateTransform attributeName="transform" type="translate" values="0,-10; 12,140" dur="5.0s" begin="-2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="385" cy="0" r="1.5" fill-opacity="0.6">
        <animateTransform attributeName="transform" type="translate" values="0,-10; -9,140" dur="6.8s" begin="-4.9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="495" cy="0" r="2.0" fill-opacity="0.85">
        <animateTransform attributeName="transform" type="translate" values="0,-10; 8,140" dur="5.8s" begin="-0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="605" cy="0" r="1.4" fill-opacity="0.55">
        <animateTransform attributeName="transform" type="translate" values="0,-10; -10,140" dur="7.4s" begin="-3.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="715" cy="0" r="2.1" fill-opacity="0.8">
        <animateTransform attributeName="transform" type="translate" values="0,-10; 11,140" dur="5.2s" begin="-1.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="825" cy="0" r="1.6" fill-opacity="0.65">
        <animateTransform attributeName="transform" type="translate" values="0,-10; -7,140" dur="6.4s" begin="-4.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="915" cy="0" r="1.9" fill-opacity="0.75">
        <animateTransform attributeName="transform" type="translate" values="0,-10; 9,140" dur="5.6s" begin="-2.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Animated Crystal Snowflakes -->
    <g stroke="#E0F7FA" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.7">
      <g>
        <animateTransform attributeName="transform" type="translate" values="140,-12; 152,140" dur="6.5s" begin="-2.0s" repeatCount="indefinite"/>
        <line x1="-4.5" y1="0" x2="4.5" y2="0"/>
        <line x1="-2.25" y1="-3.9" x2="2.25" y2="3.9"/>
        <line x1="-2.25" y1="3.9" x2="2.25" y2="-3.9"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="555,-12; 544,140" dur="7.1s" begin="-4.5s" repeatCount="indefinite"/>
        <line x1="-4.5" y1="0" x2="4.5" y2="0"/>
        <line x1="-2.25" y1="-3.9" x2="2.25" y2="3.9"/>
        <line x1="-2.25" y1="3.9" x2="2.25" y2="-3.9"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="870,-12; 880,140" dur="6.0s" begin="-1.1s" repeatCount="indefinite"/>
        <line x1="-4.5" y1="0" x2="4.5" y2="0"/>
        <line x1="-2.25" y1="-3.9" x2="2.25" y2="3.9"/>
        <line x1="-2.25" y1="3.9" x2="2.25" y2="-3.9"/>
      </g>
    </g>
  </g>
</svg>
